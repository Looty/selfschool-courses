stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - data/raw.csv
    outs:
      - data/clean.csv
  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/clean.csv
    params:
      - train.C
      - train.seed
    outs:
      - models/model.pkl
    metrics:
      - metrics.json:
          cache: false
