<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Nine boxes around a small box labelled Model code: data validation, feature store and metadata store on top; pipeline orchestrator and model validation on the sides; model registry, prediction service and monitoring below.">
  <rect width="1000" height="600" fill="#f4f4f1"/>
  <!-- hotspot percent coordinates in the quizzes are measured on this 1000 x 600 canvas -->
  <g fill="none" stroke="#5f5e5a" stroke-width="2">
    <path d="M320 80H360"/>
    <path d="M640 80H680"/>
    <path d="M500 130V270"/>
    <path d="M320 300H430"/>
    <path d="M570 300H680"/>
    <path d="M820 370V470"/>
    <path d="M680 520H640"/>
    <path d="M360 520H320"/>
  </g>
  <g fill="#ffffff" stroke="#2c2c2a" stroke-width="2">
    <rect x="40" y="30" width="280" height="100" rx="8"/>
    <rect x="360" y="30" width="280" height="100" rx="8"/>
    <rect x="680" y="30" width="280" height="100" rx="8"/>
    <rect x="40" y="230" width="280" height="140" rx="8"/>
    <rect x="680" y="230" width="280" height="140" rx="8"/>
    <rect x="40" y="470" width="280" height="100" rx="8"/>
    <rect x="360" y="470" width="280" height="100" rx="8"/>
    <rect x="680" y="470" width="280" height="100" rx="8"/>
  </g>
  <rect x="430" y="270" width="140" height="60" rx="8" fill="#2c2c2a" stroke="#2c2c2a" stroke-width="2"/>
  <g fill="#2c2c2a" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle">
    <text x="180" y="88">Data validation</text>
    <text x="500" y="88">Feature store</text>
    <text x="820" y="88">Metadata store</text>
    <text x="180" y="308">Pipeline orchestrator</text>
    <text x="820" y="308">Model validation</text>
    <text x="180" y="528">Model registry</text>
    <text x="500" y="528">Prediction service</text>
    <text x="820" y="528">Monitoring</text>
  </g>
  <text x="500" y="307" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" text-anchor="middle">Model code</text>
</svg>
