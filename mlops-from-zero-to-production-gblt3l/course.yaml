schemaVersion: 1
id: mlops-from-zero-to-production-gblt3l
title: MLOps from Zero to Production
short_intro: "Run machine learning in production the way you run services: versioned, tested, automated and monitored."
description: |
  A practical, tool-aware path through MLOps for engineers who already know DevOps. It covers why ML systems
  are harder to operate than ordinary software, the minimum ML you need as an operator, data and feature
  management, experiment tracking and model registries, CI/CD and continuous training, serving and release
  strategies, monitoring and drift, and governance, including what changes for generative AI. It then goes
  deeper: orchestration with Airflow, managed cloud platforms (SageMaker and Azure ML), ML on Kubernetes (GPUs,
  Jobs, Kueue, KubeRay), LLM applications in practice (RAG, evaluations, tracing, security), and three hands-on
  labs (MLflow, DVC, Evidently) and a capstone design.

  Who it is for: software and DevOps engineers with a few years of experience and a computer science background,
  new to ML in production. Assumes Git, containers, CI and Kubernetes basics. Every factual claim cites a source
  read during research (see sources.md).
level: Intermediate
