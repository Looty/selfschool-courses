id: private-cloud-engineering-with-python-910via
title: "Private Cloud Engineering with Python"
short_intro: "Fluent Python without autocomplete, job-queue APIs with Flask, FastAPI and RQ, and the Linux, Git, container, KVM and CI stack underneath."
description: |
  A practice-first course for engineers who build and run internal cloud platforms: self-service virtual machines
  on KVM hypervisors, the Python services that provision them, and the build and CI systems around them.

  The first third is Python you can type from memory in a bare browser editor: the built-in types, `collections`,
  sorting and heaps, classes, text parsing, then timed infrastructure problems (log aggregation, reservations and
  VM placement, build dependency order, caches and rate limiters) and scripts that call the system. Every exercise
  ships a starter file, a reference solution and a standard-library test file, so you check your own work with
  one command.

  The middle is the ground a platform stands on: Linux processes, systemd, permissions, disks and networking with
  a broken-box terminal lab; Git objects, rebasing and recovery with a lab; containers from namespaces and cgroups
  up to Dockerfiles and Compose, with a debugging lab.

  The last third builds upward: REST services in Flask and FastAPI with an RQ and Redis job queue, the design of
  a VM provisioning service and of a CI and build system, Jenkins pipelines, KVM, QEMU and libvirt, Ansible and
  Fabric, and short chapters on working with AI tools, Kubernetes and AWS. It ends with a two-hour timed
  practice run.

  Who it is for: DevOps and platform engineers with a few years of experience who want the working knowledge
  sharp and the Python fluent. Labs run with Python 3 and Docker. Every factual claim cites a source from
  sources.md. For Linux performance triage (USE method, OOM, cgroups, file descriptors, strace) see the
  companion course "Shipping Software on Linux: Essentials", chapter 7.
