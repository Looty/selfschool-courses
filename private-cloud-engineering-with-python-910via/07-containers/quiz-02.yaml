schemaVersion: 1
id: q19
title: "Check: images, layers and Dockerfiles"
questions:
  - id: q19-1
    type: spot
    text: "This is Dockerfile.bad. Click the line that leaks a credential to anyone who can pull the image."
    concepts: [dockerfile-secrets, arg-vs-env]
    sources: [71]
    code: |
      FROM python:latest
      ADD . /app
      WORKDIR /app
      RUN apt-get update
      RUN apt-get install -y curl build-essential
      RUN pip install -r requirements.txt
      ENV API_TOKEN=s3cr3t-token-123
      RUN rm -rf /root/.cache
      EXPOSE 8000
      ENTRYPOINT python app/service.py; echo "service exited"
    correct: [7]
    explanation: "ENV values persist in the image and show up in docker inspect; the test run printed API_TOKEN=s3cr3t-token-123 from the image's config. Pass secrets at run time, or use RUN --mount=type=secret during the build. ARG would not help: build arguments are visible in docker history."
  - id: q19-2
    type: spot
    text: "Every edit to service.py makes this build reinstall all dependencies. Click the line that causes it."
    concepts: [build-cache, layer-order]
    sources: [74]
    code: |
      FROM python:3.13-slim-bookworm
      WORKDIR /app
      COPY . .
      RUN pip install --no-cache-dir -r requirements.txt
      ENTRYPOINT ["python", "service.py"]
    correct: [3]
    explanation: "COPY . . puts the source into the same layer as requirements.txt, before the install. Any changed file invalidates that layer and every layer after it, including pip install. Copy requirements.txt first, install, then copy the source."
  - id: q19-3
    type: trace
    text: "For each image and docker run command, what command line runs, and which program is PID 1 in the container?"
    concepts: [cmd-vs-entrypoint, pid-1]
    sources: [71]
    code: |
      Image X:  ENTRYPOINT ["python", "app.py"]
                CMD ["--port", "8000"]
      Image Y:  ENTRYPOINT python app.py
      Image Z:  CMD ["python", "app.py"]

      1: docker run X
      2: docker run X --port 9000
      3: docker run Y --port 9000
      4: docker run Z bash
    variables: [runs, pid1]
    steps:
      - {label: "1", values: {runs: ["python app.py --port 8000"], pid1: ["python"]}}
      - {label: "2", values: {runs: ["python app.py --port 9000"], pid1: ["python"]}}
      - {label: "3", values: {runs: ["/bin/sh -c python app.py", "/bin/sh -c 'python app.py'", "sh -c python app.py"], pid1: ["sh", "/bin/sh"]}}
      - {label: "4", values: {runs: ["bash"], pid1: ["bash"]}}
    explanation: "Exec-form ENTRYPOINT gets CMD appended (1), and docker run arguments replace CMD (2). Shell-form ENTRYPOINT runs under /bin/sh -c and ignores both CMD and run arguments, so the shell is PID 1 and --port 9000 is lost (3). With no ENTRYPOINT, run arguments replace CMD entirely (4)."
  - id: q19-4
    type: fill
    text: "Complete the runtime half of a multi-stage Dockerfile so the final image holds only the virtual environment, runs as a non-root user, and stops cleanly."
    concepts: [multi-stage-build, pid-1, dockerfile-user]
    sources: [71, 73]
    template: |
      FROM python:3.13-bookworm {{1}} build
      RUN python -m venv /opt/venv && /opt/venv/bin/pip install --no-cache-dir prometheus-client==0.26.0

      FROM python:3.13-slim-bookworm
      RUN groupadd -r app && useradd --no-log-init -r -g app app
      COPY {{2}} /opt/venv /opt/venv
      COPY service.py /app/
      {{3}} app
      ENTRYPOINT {{4}}
    chips:
      - {text: "AS", slot: 1, explanation: "AS names the stage so later instructions can refer to it."}
      - {text: "--from=build", slot: 2, explanation: "COPY --from takes files from the named stage instead of the build context."}
      - {text: "USER", slot: 3, explanation: "USER switches later RUN, CMD and ENTRYPOINT to that user."}
      - {text: "[\"/opt/venv/bin/python\", \"/app/service.py\"]", slot: 4, explanation: "Exec form runs Python directly as PID 1, so it receives SIGTERM from docker stop."}
      - {text: "/opt/venv/bin/python /app/service.py", explanation: "Shell form wraps the command in /bin/sh -c, which does not pass SIGTERM on."}
      - {text: "ADD", explanation: "ADD has no stage-naming role; it copies files and can fetch URLs or unpack archives."}
  - id: q19-5
    type: sort
    text: "Which of these Dockerfile instructions add a filesystem layer, and which only change image metadata?"
    concepts: [image-layers]
    sources: [68]
    buckets: ["Adds a filesystem layer", "Metadata only"]
    items:
      - {text: "FROM python:3.13-slim-bookworm", bucket: "Adds a filesystem layer", explanation: "FROM brings in the base image's layers."}
      - {text: "COPY app/ ./app/", bucket: "Adds a filesystem layer", explanation: "New files land in a new layer."}
      - {text: "RUN pip install -r requirements.txt", bucket: "Adds a filesystem layer", explanation: "Everything the command writes becomes a layer (12.2 MB in the bad image)."}
      - {text: "RUN rm -rf /root/.cache", bucket: "Adds a filesystem layer", explanation: "A delete is also a change: it adds a layer of whiteouts and frees nothing from earlier layers."}
      - {text: "LABEL org.opencontainers.image.version=1.0.0", bucket: "Metadata only", explanation: "LABEL changes the image config, not the files."}
      - {text: "CMD [\"python\", \"/app/service.py\"]", bucket: "Metadata only", explanation: "CMD records the default command; nothing runs at build time."}
  - id: q19-6
    type: mcq
    text: "An image uses shell-form ENTRYPOINT. With docker run --init, docker stop -t 10 returns in 0.47 s with exit 143, but the app's 'SIGTERM received' log line never appears. What is the best fix?"
    concepts: [pid-1, docker-stop, init-process]
    sources: [71, 79, 80, 105, 125]
    options:
      - {text: "Change the ENTRYPOINT to exec form so the app itself is PID 1 and runs its SIGTERM handler", correct: true, explanation: "Then docker stop's SIGTERM reaches the app directly; the test run stopped in 0.42 s with exit 0 and the shutdown log line."}
      - {text: "Keep --init; exit 143 shows a clean shutdown", correct: false, explanation: "143 is death by SIGTERM (128 + 15). The signal killed the shell wrapper, and the app's own handler never ran."}
      - {text: "Raise the stop timeout to 60 seconds", correct: false, explanation: "The shell never passes SIGTERM on, so a longer wait only delays the SIGKILL."}
      - {text: "Add STOPSIGNAL SIGKILL", correct: false, explanation: "That makes every stop an immediate, uncatchable kill: fast, but never clean."}
