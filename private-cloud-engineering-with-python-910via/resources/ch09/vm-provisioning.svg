<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Architecture of the VM provisioning service. A client calls the API service, which checks auth and quotas, writes the database and enqueues a job. A worker takes the job, asks the scheduler for a host and IPAM for an address, then drives a hypervisor through libvirt; the hypervisor fetches base images from the image store. A reconciler compares the database with the hypervisors.">
  <!-- Hotspot percent coordinates in quiz-01.yaml are measured on this 1000 x 600 canvas:
       every component box is 140 x 78, so x% = x / 10, y% = y / 6, w = 14, h = 13.
       Columns x = 10, 220, 430, 640, 850. Rows y = 60, 210, 360. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3d3d3a"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#f4f4f1"/>
  <text x="500" y="34" fill="#1f1f1d" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Self-service VM provisioning: one create request</text>

  <!-- arrows (drawn first so the number badges sit on top) -->
  <g fill="none" stroke="#3d3d3a" stroke-width="2" marker-end="url(#arrow)">
    <path d="M150 249H218"/>
    <path d="M290 210V140"/>
    <path d="M330 288L448 358"/>
    <path d="M360 249H428"/>
    <path d="M570 249H638"/>
    <path d="M710 210V140"/>
    <path d="M765 210L862 140"/>
    <path d="M780 249H848"/>
    <path d="M920 288V358"/>
    <path d="M655 288L562 358"/>
    <path d="M640 399H572"/>
    <path d="M765 360L862 290"/>
  </g>

  <!-- second outline behind Hypervisors: there are many of them -->
  <rect x="856" y="204" width="140" height="78" rx="8" fill="#ffffff" stroke="#2c2c2a" stroke-width="2"/>

  <!-- component boxes -->
  <g fill="#ffffff" stroke="#2c2c2a" stroke-width="2">
    <rect x="220" y="60" width="140" height="78" rx="8"/>
    <rect x="640" y="60" width="140" height="78" rx="8"/>
    <rect x="850" y="60" width="140" height="78" rx="8"/>
    <rect x="10" y="210" width="140" height="78" rx="8"/>
    <rect x="220" y="210" width="140" height="78" rx="8"/>
    <rect x="430" y="210" width="140" height="78" rx="8"/>
    <rect x="640" y="210" width="140" height="78" rx="8"/>
    <rect x="850" y="210" width="140" height="78" rx="8"/>
    <rect x="430" y="360" width="140" height="78" rx="8"/>
    <rect x="640" y="360" width="140" height="78" rx="8"/>
    <rect x="850" y="360" width="140" height="78" rx="8"/>
  </g>

  <!-- component names -->
  <g fill="#1f1f1d" font-family="system-ui, sans-serif" font-size="17" font-weight="600" text-anchor="middle">
    <text x="290" y="95">Auth and quotas</text>
    <text x="710" y="95">Scheduler</text>
    <text x="920" y="95">IPAM</text>
    <text x="80" y="245">Client</text>
    <text x="290" y="245">API service</text>
    <text x="500" y="245">Job queue</text>
    <text x="710" y="245">Worker</text>
    <text x="920" y="245">Hypervisors</text>
    <text x="500" y="395">Database</text>
    <text x="710" y="395">Reconciler</text>
    <text x="920" y="395">Image store</text>
  </g>

  <!-- one-line roles -->
  <g fill="#3d3d3a" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">
    <text x="290" y="117">who asks, how much</text>
    <text x="710" y="117">filter, then weigh</text>
    <text x="920" y="117">one address per VM</text>
    <text x="80" y="267">CLI, portal, CI job</text>
    <text x="290" y="267">REST, validation</text>
    <text x="500" y="267">provision jobs</text>
    <text x="710" y="267">runs the steps</text>
    <text x="920" y="267">KVM and libvirt</text>
    <text x="500" y="417">source of truth</text>
    <text x="710" y="417">compare and repair</text>
    <text x="920" y="417">base qcow2 images</text>
  </g>

  <!-- number badges on the arrows -->
  <g fill="#1f1f1d" stroke="#1f1f1d" stroke-width="1">
    <circle cx="184" cy="249" r="11"/>
    <circle cx="290" cy="175" r="11"/>
    <circle cx="389" cy="323" r="11"/>
    <circle cx="394" cy="249" r="11"/>
    <circle cx="604" cy="249" r="11"/>
    <circle cx="710" cy="175" r="11"/>
    <circle cx="813" cy="175" r="11"/>
    <circle cx="814" cy="249" r="11"/>
    <circle cx="920" cy="323" r="11"/>
    <circle cx="608" cy="323" r="11"/>
    <circle cx="606" cy="399" r="11"/>
    <circle cx="813" cy="325" r="11"/>
  </g>
  <g fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    <text x="184" y="253">1</text>
    <text x="290" y="179">2</text>
    <text x="389" y="327">3</text>
    <text x="394" y="253">4</text>
    <text x="604" y="253">5</text>
    <text x="710" y="179">6</text>
    <text x="813" y="179">7</text>
    <text x="814" y="253">8</text>
    <text x="920" y="327">9</text>
    <text x="608" y="327">10</text>
    <text x="606" y="403">R</text>
    <text x="813" y="329">R</text>
  </g>

  <!-- legend -->
  <rect x="10" y="462" width="980" height="128" rx="8" fill="#ffffff" stroke="#8a8a85" stroke-width="1"/>
  <g fill="#1f1f1d" font-family="system-ui, sans-serif" font-size="13">
    <text x="26" y="486">1  POST /v1/vms with an Idempotency-Key header</text>
    <text x="26" y="505">2  Authenticate the caller, check the project quota</text>
    <text x="26" y="524">3  Insert the VM row, state BUILDING</text>
    <text x="26" y="543">4  Enqueue the provision job, reply 202 with a status URL</text>
    <text x="26" y="562">5  A worker takes the job from the queue</text>
    <text x="26" y="581">6  Filter and weigh the hosts, reserve capacity on one</text>
    <text x="516" y="486">7  Reserve a free IP address for the VM</text>
    <text x="516" y="505">8  Over libvirt: create the disk, define and start the domain</text>
    <text x="516" y="524">9  The host fetches the base image if it is not cached</text>
    <text x="516" y="543">10  Write the result: state ACTIVE, or ERROR with a reason</text>
    <text x="516" y="562">R  Reconciler, on a timer: compare the database with what</text>
    <text x="531" y="581">each hypervisor reports, and repair the difference</text>
  </g>
</svg>
