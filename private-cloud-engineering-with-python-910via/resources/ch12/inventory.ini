# Inventory for site.yml: the hosts that run the vmapi service.
# 192.0.2.0/24 is a documentation address range. Replace it with real addresses.
#
#   ansible-inventory -i inventory.ini --list     # show what Ansible parsed
#   ansible hv_mgmt -i inventory.ini -m ping      # can the control node reach them?

[hv_mgmt]
hvm01 ansible_host=192.0.2.11
hvm02 ansible_host=192.0.2.12
hvm03 ansible_host=192.0.2.13
hvm04 ansible_host=192.0.2.14 vmapi_workers=4

# Group variables: every host in hv_mgmt gets these.
# hvm04 sets vmapi_workers itself, and a host variable beats a group variable.
[hv_mgmt:vars]
ansible_user=deploy
vmapi_port=8080
vmapi_workers=2

# A parent group. Every member of hv_mgmt is also a member of production.
[production:children]
hv_mgmt
