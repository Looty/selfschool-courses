# A small Python HTTP API on Kubernetes: a Deployment with three replicas and a
# ClusterIP Service in front of it.
#
#   kubectl apply -f deployment.yaml
#   kubectl rollout status deployment/vmapi
#   kubectl get pods -l app=vmapi -o wide
#
# The image name is a placeholder: build and push your own image, which must
# serve GET /healthz and GET /readyz on port 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmapi
  labels:
    app: vmapi
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vmapi                 # must match the Pod template labels below
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                # at most 4 Pods exist during a rollout
      maxUnavailable: 0          # never drop below 3 ready Pods
  template:
    metadata:
      labels:
        app: vmapi
    spec:
      containers:
        - name: api
          image: registry.example.internal/vmapi:1.4.2
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: VMAPI_LOG_LEVEL
              value: info
          resources:
            requests:            # the scheduler places the Pod using these
              cpu: "250m"
              memory: "256Mi"
            limits:              # CPU over the limit is throttled; memory over it can be OOM-killed
              cpu: "1"
              memory: "512Mi"
          startupProbe:          # up to 30 x 5 s = 150 s to start; the other probes wait for it
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:         # failing repeatedly: the kubelet restarts the container
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:        # failing: the Pod is taken out of the Service, not restarted
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vmapi
spec:
  type: ClusterIP                # the default: reachable only inside the cluster
  selector:
    app: vmapi
  ports:
    - name: http
      port: 80                   # clients call vmapi:80 ...
      targetPort: http           # ... and traffic goes to the container's port 8080
