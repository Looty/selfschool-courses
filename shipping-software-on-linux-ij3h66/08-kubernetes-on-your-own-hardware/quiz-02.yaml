schemaVersion: 1
id: q31
title: "Check: pod networking and Services"
questions:
  - id: q31-1
    type: fill
    text: "Put the hops of a packet from pod A (node 1) to pod B (node 2), using flannel VXLAN, in order."
    concepts: [pod-networking, vxlan]
    sources: [82]
    template: |
      {{1}}
      {{2}}
      {{3}}
      {{4}}
    chips:
      - {text: "pod A eth0", slot: 1, explanation: "The pod's end of the veth pair."}
      - {text: "veth on node 1, attached to cni0", slot: 2, explanation: "The node's end of the pair, on the bridge."}
      - {text: "flannel.1 on node 1 (encapsulate in UDP 8472)", slot: 3, explanation: "The route for node 2's pod subnet points at flannel.1."}
      - {text: "flannel.1 on node 2, then cni0 and pod B's veth", slot: 4, explanation: "Decapsulated and delivered locally."}
      - {text: "kube-proxy", explanation: "kube-proxy only programs rules; packets do not pass through a kube-proxy process."}
  - id: q31-2
    type: spot
    text: "Which rule actually rewrites the destination to a pod?"
    concepts: [kube-proxy, iptables]
    sources: [73, 80]
    code: |
      -A KUBE-SERVICES -d 10.43.47.135/32 -p tcp -m tcp --dport 80 -j KUBE-SVC-LOLE4ISW44XBNF3G
      -A KUBE-SVC-LOLE4ISW44XBNF3G -m statistic --mode random --probability 0.50000000000 -j KUBE-SEP-PPBVO6H7TO6NUCTA
      -A KUBE-SVC-LOLE4ISW44XBNF3G -j KUBE-SEP-RGD2WMRN4PLP5TTK
      -A KUBE-SEP-RGD2WMRN4PLP5TTK -s 10.42.1.5/32 -j KUBE-MARK-MASQ
      -A KUBE-SEP-RGD2WMRN4PLP5TTK -p tcp -m tcp -j DNAT --to-destination 10.42.1.5:80
    correct: [5]
    explanation: "KUBE-SERVICES matches the ClusterIP, KUBE-SVC picks an endpoint at random, and the per-endpoint KUBE-SEP chain does the DNAT. Line 4 only marks traffic that comes from that same pod for masquerading; it does not change the destination."
  - id: q31-3
    type: mcq
    text: "You run a fleet on Kubernetes 1.37 with kube-proxy in ipvs mode. What does the documentation say you should plan for?"
    concepts: [kube-proxy-modes]
    sources: [73]
    options:
      - {text: "ipvs is deprecated since 1.35, off by default from 1.40, removed in 1.43; nftables is the recommended replacement", correct: true, explanation: "nftables needs kernel 5.13 or later."}
      - {text: "ipvs becomes the default in 1.40", correct: false, explanation: "The future default is nftables."}
      - {text: "Nothing; ipvs is the long-term mode", correct: false, explanation: "It is deprecated."}
      - {text: "Switch to userspace mode", correct: false, explanation: "Not one of the documented Linux modes."}
  - id: q31-4
    type: mcq
    text: "In `conntrack -L` you see `src=10.42.0.4 dst=10.43.47.135 ... src=10.42.1.5 dst=10.42.0.4`. What does the second tuple tell you?"
    concepts: [conntrack, dnat]
    sources: [73]
    options:
      - {text: "Replies come from backend pod 10.42.1.5, the DNAT target chosen for this connection", correct: true, explanation: "The reply tuple shows the translated endpoint."}
      - {text: "The client's IP was rewritten to 10.42.1.5", correct: false, explanation: "iptables mode keeps the client IP; it is the destination that changes."}
      - {text: "The Service IP is 10.42.1.5", correct: false, explanation: "The Service IP is 10.43.47.135."}
      - {text: "The connection failed", correct: false, explanation: "ASSURED/TIME_WAIT show a completed connection."}
  - id: q31-5
    type: open
    text: "Explain why pods on a flannel VXLAN cluster have a smaller MTU than the nodes, and what would happen if the node network itself had an MTU below 1500 (for example 1400 on a VPN) but flannel was left at 1450."
    concepts: [mtu, vxlan]
    sources: [82]
    rubric: |
      - VXLAN adds encapsulation headers, so pod packets must be smaller than the node's MTU.
      - flannel derives its MTU from the external interface unless set; a mismatch leaves pods sending packets the path cannot carry.
      - Symptoms: small requests work, large packets are dropped or need fragmentation; fix by setting the overlay MTU from the real path MTU.
