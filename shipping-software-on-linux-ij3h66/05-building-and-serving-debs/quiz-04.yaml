schemaVersion: 1
id: q21
title: "Check: Lab 3"
questions:
  - id: q21-1
    type: trace
    text: "Trace the versions installed on the client after each lab step."
    concepts: [lab-3, hotfix]
    sources: [31, 33]
    code: |
      apt-get install shiplab-suite                    # repo: devenv 0.1.0-1, suite 1.0-1
      # publish shiplab-devenv 0.1.1-1 only
      apt-get install --only-upgrade shiplab-devenv
    variables: [devenv, suite]
    steps:
      - {label: "after line 1", values: {devenv: ["0.1.0-1"], suite: ["1.0-1"]}}
      - {label: "after line 3", values: {devenv: ["0.1.1-1"], suite: ["1.0-1"]}}
    explanation: "The suite's range (>= 0.1.0-1, << 0.2) allows the hotfix, so only shiplab-devenv changes."
  - id: q21-2
    type: mcq
    text: "Why did the hotfix not require a new version of shiplab-suite?"
    concepts: [meta-package, version-ranges]
    sources: [31, 33]
    options:
      - {text: "Its Depends uses a range, and 0.1.1-1 is inside it", correct: true, explanation: "A pin with = would have forced a suite rebuild for every component fix."}
      - {text: "apt ignores meta-package dependencies", correct: false, explanation: "apt enforces them."}
      - {text: "reprepro updates dependent packages automatically", correct: false, explanation: "It does not rewrite packages."}
      - {text: "Because both packages are Architecture: all", correct: false, explanation: "Architecture has nothing to do with it."}
  - id: q21-3
    type: sort
    text: "Sort each item by where it lives in the lab."
    concepts: [lab-3, artifacts]
    sources: [43, 51]
    buckets: ["Committed to the course repository", "Built or generated in containers only"]
    items:
      - {text: "build-deb.sh and lab3-run.sh", bucket: "Committed to the course repository", explanation: "Scripts are source."}
      - {text: "shiplab-devenv_0.1.1-1_all.deb", bucket: "Built or generated in containers only", explanation: "Build outputs are never committed."}
      - {text: "The repository's signing key", bucket: "Built or generated in containers only", explanation: "Generated in a volume and deleted at the end."}
      - {text: "dists/stable/InRelease", bucket: "Built or generated in containers only", explanation: "Generated by reprepro."}
      - {text: "The devenv project's pyproject.toml", bucket: "Committed to the course repository", explanation: "Source of the package."}
  - id: q21-4
    type: open
    text: "From your run, explain why the first draft of the package (`Depends: python3.11`) installed but did not run, and how the fixed Depends line prevents it on any Debian 12 host."
    concepts: [bundled-venv, depends]
    sources: [2, 31]
    rubric: |
      - The venv's bin/python3 is a symlink to /usr/bin/python3, which python3.11 alone did not provide.
      - The fixed line depends on python3 (>= 3.11), python3 (<< 3.12), so apt installs the right interpreter package.
      - The upper bound keeps the venv's lib/python3.11 matching the interpreter.
