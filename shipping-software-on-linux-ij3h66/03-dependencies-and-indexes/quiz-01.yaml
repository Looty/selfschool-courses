schemaVersion: 1
id: q10
title: "Check: ranges and locks"
questions:
  - id: q10-1
    type: sort
    text: "Sort each requirement into where it belongs."
    concepts: [ranges-vs-locks, dependencies]
    sources: [30, 29]
    buckets: ["Library's pyproject.toml", "Application's lock file"]
    items:
      - {text: "packaging>=23", bucket: "Library's pyproject.toml", explanation: "A minimal range that leaves room for other packages."}
      - {text: "packaging==26.3 with --hash=sha256:...", bucket: "Application's lock file", explanation: "An exact, hashed pin describes one environment."}
      - {text: "certifi==2026.10.23 (a transitive dependency)", bucket: "Application's lock file", explanation: "Locks list every package, including transitive ones."}
      - {text: "requests>=2.31,<3", bucket: "Library's pyproject.toml", explanation: "A compatible range for a library's users."}
  - id: q10-2
    type: mcq
    text: "Which CI command fails the build when someone changed pyproject.toml but forgot to update uv.lock?"
    concepts: [uv-lock, ci]
    sources: [21]
    options:
      - {text: "uv sync --locked", correct: true, explanation: "It raises an error instead of updating a stale lockfile."}
      - {text: "uv sync --frozen", correct: false, explanation: "--frozen uses the lockfile without checking whether it is up to date."}
      - {text: "uv lock", correct: false, explanation: "That rewrites the lock, hiding the mistake."}
      - {text: "uv export --format requirements.txt", correct: false, explanation: "Export converts the lock; it does not check it against pyproject.toml."}
  - id: q10-3
    type: spot
    text: "This file is installed with `pip install -r requirements.txt`. Which line makes the install fail?"
    concepts: [hash-checking, require-hashes]
    sources: [10]
    code: |
      click==8.5.0 \
          --hash=sha256:255bc9599cf7748b4b1a446ccc735421bd08a2ae529a8b88597d3de5664ee360
      colorama>=0.4
      packaging==26.3 \
          --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
    correct: [3]
    explanation: "One hashed line turns on hash-checking for the whole file, and in that mode every requirement must be pinned with == and carry a hash. Line 3 is neither."
  - id: q10-4
    type: mcq
    text: "What does adding `urllib3<2` to a constraints file passed with `-c` do?"
    concepts: [constraints-file]
    sources: [9]
    options:
      - {text: "Limits urllib3 to below 2 if something needs it, without installing it otherwise", correct: true, explanation: "Constraints control versions only; they never trigger an install."}
      - {text: "Installs urllib3 1.x into the environment", correct: false, explanation: "Including a package in a constraints file does not trigger installation."}
      - {text: "Removes urllib3 if it is already installed", correct: false, explanation: "Constraints do not uninstall anything."}
      - {text: "Is ignored unless --require-hashes is set", correct: false, explanation: "Constraints work independently of hash mode."}
  - id: q10-5
    type: open
    text: "Explain why a pip-compile output can list two hashes for one pinned version, and what happens if you keep only one of them."
    concepts: [hash-checking, wheels-and-sdists]
    sources: [10, 27]
    rubric: |
      - Says one release can have several files (for example a wheel and an sdist), each with its own hash.
      - Says pip accepts a file only if its hash is listed.
      - Says keeping one hash means installs fail when pip picks the other file (for example on a platform without a matching wheel).
