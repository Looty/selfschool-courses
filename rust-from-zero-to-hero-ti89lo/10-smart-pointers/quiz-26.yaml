schemaVersion: 1
id: q26
title: "Check: Rc, RefCell and Weak"
max_attempts: 0
passing_percentage: 70
show_answers: true
shuffle: false
questions:
  - id: q26-1
    type: match
    text: "Match each need to the type that provides it."
    concepts: [smart-pointer-choice]
    pairs:
      - {left: "One owner, value on the heap", right: "Box<T>", explanation: "Single ownership, borrow checking at compile time."}
      - {left: "Several owners on one thread, read-only access", right: "Rc<T>", explanation: "Reference counted, shared access only."}
      - {left: "Mutate through &self, borrow rules checked at run time", right: "RefCell<T>", explanation: "Interior mutability with dynamic borrow tracking."}
      - {left: "Several owners on one thread, each able to mutate", right: "Rc<RefCell<T>>", explanation: "Combine shared ownership with interior mutability."}
      - {left: "A child's pointer back to its parent, not owning it", right: "Weak<T>", explanation: "Does not keep the parent alive, so no cycle leak."}
  - id: q26-2
    type: trace
    text: "What does Rc::strong_count(&a) return at each point?"
    concepts: [rc]
    code: |
      let a = Rc::new(String::from("x"));
      let b = Rc::clone(&a);
      {
          let c = Rc::clone(&a);
      }
      drop(b);
    variables: [strong_count]
    steps:
      - {label: "after line 1", values: {strong_count: "1"}}
      - {label: "after line 2", values: {strong_count: "2"}}
      - {label: "inside the block, after line 4", values: {strong_count: "3"}}
      - {label: "after the block ends (line 5)", values: {strong_count: "2"}}
      - {label: "after drop(b)", values: {strong_count: "1"}}
    explanation: "Each Rc::clone adds one; each dropped Rc subtracts one. The String is freed only when the last Rc (a) goes away."
  - id: q26-3
    type: mcq
    text: "What happens if code calls borrow_mut() on a RefCell while a Ref from borrow() is still alive?"
    concepts: [refcell]
    sources: [14, 30]
    options:
      - {text: "The thread panics with an 'already borrowed' error.", correct: true, explanation: "RefCell enforces the borrowing rules at run time."}
      - {text: "It fails to compile.", correct: false, explanation: "RefCell moves the check from compile time to run time."}
      - {text: "The second borrow waits until the first ends.", correct: false, explanation: "That is a lock's behavior; RefCell panics."}
  - id: q26-4
    type: short
    text: "Which method turns a Weak<T> into an Option<Rc<T>>?"
    answers: ["upgrade", "upgrade()", "Weak::upgrade"]
    concepts: [weak]
  - id: q26-5
    type: mcq
    text: "Why does the compiler refuse to send an Rc<T> to another thread?"
    concepts: [rc, send-sync]
    sources: [29]
    options:
      - {text: "Its reference count is updated non-atomically, so two threads could corrupt it; Rc is not Send.", correct: true, explanation: "Use Arc for multithreaded shared ownership."}
      - {text: "Rc values live on the stack.", correct: false, explanation: "Rc allocates on the heap."}
      - {text: "Threads cannot share heap memory in Rust.", correct: false, explanation: "They can, through Arc and other Sync types."}
  - id: q26-6
    type: open
    text: "Explain how a reference cycle leaks memory with Rc, why Rust still calls that safe, and how Weak prevents it."
    concepts: [weak, memory-leaks]
    sources: [14, 24]
    rubric: |
      - Explains two Rc values pointing at each other keep both strong counts above zero, so neither is ever dropped.
      - Says a leak is not undefined behavior: no memory is used after being freed, so Rust's safety guarantee holds.
      - Explains Weak does not count as an owner, so the cycle's strong counts can reach zero, and upgrade() returns None afterwards.
