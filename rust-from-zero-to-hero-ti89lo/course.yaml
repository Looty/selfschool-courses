schemaVersion: 1
id: rust-from-zero-to-hero-ti89lo
title: Rust from Zero to Hero
short_intro: "Ownership, traits, lifetimes, concurrency and async: Rust for C and C++ programmers, with tested projects."
description: |
  A practical path from your first `cargo new` to shipping a command-line tool and an async web service in Rust.
  It covers why Rust suits AI coding agents, the toolchain, core syntax, ownership and borrowing, modules and Cargo, error handling, generics and
  traits, lifetimes, collections, closures and iterators, testing, smart pointers, threads, async with Tokio,
  patterns, macros and unsafe Rust, then five hands-on labs and a capstone.

  Who it is for: programmers with a systems background (C or C++), who know pointers, the stack and the heap.
  Ownership is explained against RAII and `std::move`, `Box` against `unique_ptr`, `Rc` against `shared_ptr`.
  Written for Rust 1.99.1 and the 2024 edition; every lab was built and tested on that version. Every factual
  claim cites a source read during research (see sources.md).
