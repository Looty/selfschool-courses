id: how-llms-work-from-zero-to-your-own-2iy8t7
title: "How LLMs Work: From Zero to Your Own"
short_intro: "Where language models came from, why they work, and how to build and train a tiny one yourself."
description: |
  A plain-words course on large language models for engineers who are new to machine learning. It starts with
  the problem of making computers handle words, follows the idea from Turing and the Dartmouth workshop through
  ELIZA, the perceptron, backpropagation, LSTMs and word vectors, then builds up the machinery one piece at a
  time: learning from examples, tokens, the simplest possible language model (counting pairs of letters),
  attention, the Transformer and GPT. After that it covers scale, how a text predictor becomes an assistant
  (instruction tuning, RLHF, DPO), prompting, LoRA, tools and agents, reasoning models, evaluation and risks.

  Eleven labs run offline on an ordinary laptop CPU, and the capstone trains a small GPT of your own.

  Who it is for: software engineers who can read Python and have not studied machine learning. No maths beyond
  school algebra is assumed; every term is defined where it first appears and again in a glossary at the end of
  each lesson. Every factual claim cites a source read during research (see sources.md); where the sources are
  thin, a "Heads up" box says so.
