  - id: q59-2
    type: mcq
    text: "מהי דרך לנהל סיכונים של LLM, לפי השיעור?"
    concepts: [risk-management]
    sources: [37]
    options:
      - {text: "לבדוק על המקרים שלכם, לעגן תשובות במקורות, להגביל הרשאות של כלים ולשמור על אדם בלולאה (human in the loop) בהחלטות חשובות.", correct: true, explanation: "אין פתרון יחיד לאף אחד מהסיכונים."}
      - {text: "להשתמש במודל גדול יותר, שמבטל הזיות.", correct: false, explanation: "מודלים גדולים יותר היו בדרך כלל פחות אמינים ב-TruthfulQA."}
      - {text: "להגדיר את הטמפרטורה (temperature) לאפס.", correct: false, explanation: "פענוח חמדני (greedy decoding) לא הופך עובדות לנכונות."}
  - id: q59-3
    type: open
    text: "בחרו את הצעד הבא בלמידה שמתאים למטרה שלכם, ונמקו אותו בעזרת משהו שבניתם בקורס."
    concepts: [next-steps]
    sources: [19, 18]
    rubric: |
      - מציין צעד הבא קונקרטי, כגון הסדרה Zero to Hero של Karpathy, הפרויקט nanochat, או שימוש במודלים באפליקציה.
      - מנמק אותו בקישור למשהו שהלומד בנה או למד בקורס, כגון ה-mini-GPT, המעבדות (labs) או ההערכה (evaluation).
