questions:
  - id: q05-1
    type: mcq
    text: "מדוע טיורינג החליף את השאלה \"האם מכונות יכולות לחשוב?\" במשחק ההחקיינות (imitation game)?"
    concepts: [turing, imitation-game]
    sources: [16]
    options:
      - {text: "הגדרת המושגים \"מכונה\" ו\"חשיבה\" לפי השימוש הרגיל במילים היא מסוכנת, ולכן הוא שאל שאלה פחות עמומה.", correct: true, explanation: "זה בדיוק מה שנאמר במאמר: השאלה המקורית תלויה באופן שבו אנשים משתמשים במילים."}
      - {text: "כי הוא האמין שמכונות בהחלט אינן יכולות לחשוב.", correct: false, explanation: "הוא לא שלל זאת; הוא שינה את השאלה."}
      - {text: "כי כבר בשנת 1950 מחשבים יכלו לעבור את המבחן.", correct: false, explanation: "המאמר מציע את המבחן; הוא אינו טוען שמכונה כלשהי עוברת אותו."}
  - id: q05-2
    type: short
    text: "באיזו צורה תשובות המשתתפים מגיעות אל החוקר, כך שטון הדיבור אינו מהווה רמז?"
    concepts: [imitation-game]
    sources: [16]
    answers: ["written", "typed", "text", "written or typed", "typewritten", "כתובות", "כתוב", "בכתב", "מוקלדות", "מוקלד", "טקסט", "בכתב או מוקלד", "כתובות או מוקלדות", "מודפסות", "מודפס"]
  - id: q05-3
    type: open
    text: "כיצד המעבר של טיורינג מוויכוח על הגדרות למשחק קשור לדרך שבה מעריכים מודלי שפה כיום?"
    concepts: [evaluation, imitation-game]
    sources: [16]
    rubric: |
      - מציין שהמשחק הופך שאלה על הגדרות לניסוי שאפשר להריץ ולספור את תוצאותיו.
      - מציין שגם בהערכה המודרנית שופטים מודל לפי התנהגותו בשאלות מבחן, ולא על ידי בחינת מה שקורה בתוכו.
