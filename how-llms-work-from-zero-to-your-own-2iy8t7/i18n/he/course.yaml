title: "איך עובדים מודלי שפה גדולים: מאפס ועד מודל משלכם"
short_intro: מאיפה הגיעו מודלי שפה, למה הם עובדים, ואיך לבנות ולאמן בעצמכם מודל קטן.
description: >
  קורס במילים פשוטות על מודלי שפה גדולים (Large Language Models, או LLMs)
  למהנדסים שאינם מכירים למידת מכונה. הקורס מתחיל בבעיה של לגרום למחשבים לעבוד עם
  מילים, ועוקב אחר הרעיון מטיורינג ומסדנת דרטמות' דרך ELIZA, הפרספטרון
  (perceptron), הפצת שגיאה לאחור (backpropagation), רשתות LSTM ווקטורי מילים
  (word vectors). לאחר מכן הוא בונה את המנגנון חלק אחר חלק: למידה מדוגמאות,
  טוקנים (tokens), מודל השפה הפשוט ביותר (ספירת זוגות של אותיות), מנגנון הקשב
  (attention), ה-Transformer ו-GPT. בהמשך הוא עוסק בקנה מידה, באופן שבו מנבא
  טקסט הופך לעוזר (instruction tuning, RLHF, DPO), בכתיבת הנחיות (prompting),
  ב-LoRA, בכלים ובסוכנים (agents), במודלי היגיון (reasoning models), בהערכה
  ובסיכונים.


  אחד-עשר מעבדות תרגול רצים במצב לא מקוון על מעבד (CPU) של מחשב נייד רגיל,
  ובפרויקט הסיום תאמנו GPT קטן משלכם.


  למי הקורס מיועד: מהנדסי תוכנה שיודעים לקרוא Python ולא למדו למידת מכונה. לא
  נדרש ידע במתמטיקה מעבר לאלגברה של בית הספר; כל מונח מוגדר במקום שבו הוא מופיע
  לראשונה, ושוב במילון מונחים בסוף כל שיעור. כל טענה עובדתית מצטטת מקור שנקרא
  במהלך המחקר (ראו sources.md); במקומות שבהם המקורות דלים, תיבת "שימו לב" מציינת
  זאת.
