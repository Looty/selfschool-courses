  - id: q38-2
    type: mcq
    text: "מה משמעות המונח 'שחרור מדורג' (staged release) של GPT-2?"
    concepts: [staged-release]
    sources: [28]
    options:
      - {text: "גרסאות קטנות יותר שוחררו תחילה, והמודל המלא שוחרר מאוחר יותר, לאחר מעקב אחר שימוש לרעה.", correct: true, explanation: "גרסה של 774M שוחררה באוגוסט, והמודל המלא בנובמבר 2019."}
      - {text: "המודל שוחרר בשלבים של האימון.", correct: false, explanation: "הכוונה היא לפרסום המודל, לא לאימון."}
      - {text: "הוא שוחרר רק לאוניברסיטאות.", correct: false, explanation: "גישה מוגבלת ניתנה תחילה לכלי תקשורת נבחרים."}
  - id: q38-3
    type: open
    text: "מאמר GPT-3 מציג גם מגבלות ולא רק תוצאות. ציינו שתי מגבלות מתוך השיעור."
    concepts: [gpt3, limitations, contamination]
    sources: [3]
    rubric: |
      - מזכיר שלמידה מעטת דוגמאות (few-shot learning) עדיין התקשתה בחלק ממערכי הנתונים.
      - מזכיר שאימון על קורפוסי אינטרנט גדולים עורר חששות מתודולוגיים (כגון הופעת נתוני בחינה בתוך נתוני האימון).
