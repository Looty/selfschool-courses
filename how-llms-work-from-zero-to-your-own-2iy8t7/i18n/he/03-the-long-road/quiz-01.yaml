  - id: q11-4
    type: open
    text: "הסבירו במילים שלכם מדוע נדרשה הפצה לאחור כדי לאמן רשתות בעלות כמה שכבות."
    concepts: [backpropagation]
    sources: [25]
    rubric: |
      - מציין שהשגיאה נראית רק בפלט, בעוד שמשקלים בשכבות מוקדמות יותר משפיעים עליה בעקיפין.
      - מציין שההפצה לאחור מעבירה נגזרות לאחור, שכבה אחר שכבה, כדי לחשב כיצד כל משקל משפיע על השגיאה.
