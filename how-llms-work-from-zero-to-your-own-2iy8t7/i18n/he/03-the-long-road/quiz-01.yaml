    type: sort
    text: "איזו גישה נפגעה מהחורף השני של הבינה המלאכותית, ואיזו המשיכה להשתפר בשקט?"
    concepts: [ai-winter, expert-systems]
    sources: [26]
    buckets: ["נפגעו מהחורף", "המשיכו להשתפר"]
    items:
      - {text: "מערכות מומחה שנבנו מכללים שנכתבו ידנית", bucket: "נפגעו מהחורף", explanation: "הן היו שבריריות ויקרות לתחזוקה."}
      - {text: "מכונות LISP (חומרה ייעודית)", bucket: "נפגעו מהחורף", explanation: "תחנות עבודה זולות יותר סיימו את השוק שלהן ב-1987."}
      - {text: "למידה מנתונים באמצעות רשתות נוירונים", bucket: "המשיכו להשתפר", explanation: "שיטות הלמידה התקדמו במשימות קטנות עד שהנתונים והמחשבים הדביקו את הפער."}
