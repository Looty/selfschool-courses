    text: "מה מחשבת ההפצה לאחור (backpropagation)?"
    concepts: [backpropagation, gradient]
    sources: [25]
    options:
      - {text: "את הגרדיינט (gradient) של פונקציית ההפסד ביחס לכל משקל, בהתקדמות לאחור משכבת הפלט.", correct: true, explanation: "הוא מראה בכמה תשתנה השגיאה אם נזיז כל משקל מעט."}
      - {text: "את התשובה הסופית של הרשת עבור קלט נתון.", correct: false, explanation: "זהו המעבר קדימה (forward pass), לא הפצה לאחור."}
      - {text: "את נתוני האימון הטובים ביותר לשימוש הבא.", correct: false, explanation: "היא אינה אומרת דבר על בחירת נתונים."}
