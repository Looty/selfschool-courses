    text: "מה עושה softmax?"
    concepts: [softmax, logits]
    sources: [20]
    options:
      - {text: "הופך ציונים גולמיים למספרים חיוביים שסכומם 1, כך שאפשר לקרוא אותם כהסתברויות.", correct: true, explanation: "זה תפקידו בשכבת הפלט של מודל שפה."}
      - {text: "בוחר את הציון הגבוה ביותר וזורק את השאר.", correct: false, explanation: "Softmax שומר על כל הציונים, בצורת הסתברויות."}
      - {text: "מוסיף רעש לציונים.", correct: false, explanation: "האקראיות מגיעה מהדגימה (sampling), לא מ-softmax."}
  - id: q28-2
    type: fill
    text: "סדרו את לולאת האימון של ה-bigram העצבי."
    concepts: [training-loop, gradient-descent]
    sources: [32, 34]
    template: |
      {{1}}, אחר כך {{2}}, אחר כך {{3}}, ואחר כך {{4}}.
    chips:
      - {text: "שולפים את השורה ומפעילים softmax", slot: 1, explanation: "מקבלים הסתברויות לתו הבא."}
