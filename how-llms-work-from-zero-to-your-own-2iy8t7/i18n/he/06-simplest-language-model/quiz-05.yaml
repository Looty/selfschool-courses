  - id: q28-3
    type: open
    text: "אם ה-bigram העצבי לומד בערך אותו דבר כמו ספירה, למה בכלל עוברים לרשתות נלמדות?"
    concepts: [scaling, context]
    sources: [33]
    rubric: |
      - מציין שספירה דורשת מספר שורות שגדל אקספוננציאלית ככל שההקשר גדל.
      - מציין שפונקציה נלמדת של ההקשר יכולה לנצל יותר הקשר עם הרבה פחות פרמטרים, וזה הצעד בדרך ל-Transformer.
