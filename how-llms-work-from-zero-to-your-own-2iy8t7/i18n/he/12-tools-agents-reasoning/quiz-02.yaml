    text: "מדוע קשה יותר להעריך סוכן (agent) מאשר להעריך תשובה בודדת?"
    concepts: [agents, evaluation]
    sources: [13]
    rubric: |
      - מציין שסוכן מבצע צעדים רבים, ושגיאה מוקדמת עלולה לקלקל את כל מה שאחריה (שגיאות מצטברות).
      - מציין שצריך להעריך מסלולים שלמים (trajectories, כלומר רצף המחשבות והפעולות), ולא רק את התשובה הסופית.
