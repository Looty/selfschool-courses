questions:
  - id: q55-1
    type: spot
    text: "לחצו על השורה שמגנה על כלי המחשבון (calculator) מפני הרצה של טקסט שרירותי."
    concepts: [tool-safety, code-reading]
    sources: [13]
    code: |
      def calculator(expression):
          if not re.fullmatch(r"[0-9+\-*/(). ]+", expression):
              return "error: only numbers and + - * / ( ) are allowed"
          return str(eval(expression))
    correct: [2]
    explanation: "בדיקת ה-fullmatch דוחה כל קלט שאינו ספרות, רווחים וסימנים חשבוניים, עוד לפני ש-eval רואה אותו."
  - id: q55-2
    type: mcq
    text: "מדוע ללולאה יש מקסימום של 5 סבבים (turns)?"
    concepts: [agents, safety]
    sources: [13]
    options:
      - {text: "בלי מגבלה, מודל שאינו נותן תשובה סופית לעולם היה רץ בלולאה אינסופית.", correct: true, explanation: "תמיד יש להגביל לולאות שתלויות בפלט של המודל."}
      - {text: "כי המחשבון יכול לבצע רק 5 חישובים.", correct: false, explanation: "אין מגבלה כזו."}
      - {text: "כדי לקצר את הפלט.", correct: false, explanation: "המגבלה היא אמצעי בטיחות."}
  - id: q55-3
    type: open
    text: "אילו חלקים במעבדה יישארו ללא שינוי אם נחליף את המודל המדומה (stand-in) במודל אמיתי, ואיזה חלק ישתנה?"
    concepts: [agents, tool-use]
    sources: [13]
    rubric: |
      - מציין שרק הפונקציה fake_model תשתנה (תוחלף בקריאה למודל אמיתי).
      - מציין שהפענוח (parsing), הרצת הכלי, החזרת התצפית (observation) כמשוב, ומגבלת הסבבים נשארים ללא שינוי.
