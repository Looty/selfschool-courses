schemaVersion: 1
id: q08
title: "Check: versions, scripts and conffiles"
questions:
  - id: q08-1
    type: fill
    text: "Order these versions as dpkg does, earliest first."
    concepts: [debian-versions, version-ordering]
    sources: [33, 34]
    template: |
      {{1}}
      {{2}}
      {{3}}
      {{4}}
      {{5}}
    chips:
      - {text: "2.0~rc1-1", slot: 1, explanation: "The tilde sorts before the end of the part, so it is earlier than 2.0."}
      - {text: "2.0-1", slot: 2, explanation: "The final release, first packaging."}
      - {text: "2.0-1+hotfix1", slot: 3, explanation: "A suffix after the revision sorts later than the bare revision."}
      - {text: "2.0-2", slot: 4, explanation: "The next packaging revision."}
      - {text: "1:1.0-1", slot: 5, explanation: "Epoch 1 beats every epoch-0 version."}
      - {text: "2.0-1~bpo12+1", explanation: "Belongs between 2.0~rc1-1 and 2.0-1; not needed in this five-slot order."}
  - id: q08-2
    type: mcq
    text: "You must ship an urgent fix for `app 3.2-4` today; the next planned packaging release will be `3.2-5`. Which version do you use?"
    concepts: [hotfix-versioning]
    sources: [33]
    options:
      - {text: "3.2-4+hotfix1", correct: true, explanation: "Later than 3.2-4, earlier than 3.2-5, so the planned release still upgrades it."}
      - {text: "3.2-4~hotfix1", correct: false, explanation: "The tilde makes it sort before 3.2-4, so it would never be offered as an upgrade."}
      - {text: "1:3.2-4", correct: false, explanation: "An epoch is permanent and not meant for hotfixes."}
      - {text: "3.2-4", correct: false, explanation: "Same version: apt sees nothing new."}
  - id: q08-3
    type: trace
    text: "For each comparison, does `dpkg --compare-versions` exit 0 (true) or 1 (false)?"
    concepts: [dpkg-compare-versions]
    sources: [36, 33]
    code: |
      dpkg --compare-versions 1.0 lt 1.0-1
      dpkg --compare-versions 1:0.9 gt 2.0
      dpkg --compare-versions 1.0.9 gt 1.0.15
    variables: [exit_code]
    steps:
      - {label: "line 1", values: {exit_code: ["0"]}}
      - {label: "line 2", values: {exit_code: ["0"]}}
      - {label: "line 3", values: {exit_code: ["1"]}}
    explanation: "A missing revision sorts earlier than a present one; any epoch 1 beats epoch 0; digit runs compare as numbers, so 9 < 15."
  - id: q08-4
    type: spot
    text: "This postinst breaks the 'safe to run twice' rule. Which line?"
    concepts: [idempotency, postinst]
    sources: [32]
    code: |
      #!/bin/sh
      set -e
      case "$1" in
        configure)
          useradd --system hello
          mkdir -p /var/lib/hello
          ;;
      esac
      exit 0
    correct: [5]
    explanation: "useradd fails if the user already exists, so a rerun by dpkg --configure -a (or an upgrade) fails under set -e. Guard it, for example with `getent passwd hello || useradd --system hello`. mkdir -p is already idempotent."
  - id: q08-5
    type: trace
    text: "Trace hello-ship's state and whether /etc/hello-ship.conf exists after each step (from the lab test)."
    concepts: [conffiles, dpkg-states]
    sources: [35, 37]
    code: |
      apt-get install ./hello-ship_1.0-1_all.deb
      apt-get remove hello-ship
      apt-get purge hello-ship
    variables: [dpkg_l, conf_exists]
    steps:
      - {label: "after install", values: {dpkg_l: ["ii"], conf_exists: ["yes"]}}
      - {label: "after remove", values: {dpkg_l: ["rc"], conf_exists: ["yes"]}}
      - {label: "after purge", values: {dpkg_l: ["not listed", "none", "no packages found"], conf_exists: ["no"]}}
    explanation: "Conffiles stay after remove (state rc) and are deleted only on purge."
  - id: q08-6
    type: mcq
    text: "An unattended upgrade hangs at a prompt about /etc/app.conf. What happened, and what is the non-interactive choice?"
    concepts: [conffiles, automation]
    sources: [35, 36]
    options:
      - {text: "The admin edited a conffile that the new package also changed; pass --force-confold or --force-confnew", correct: true, explanation: "dpkg asks only when both sides changed; the force options decide without asking."}
      - {text: "The postinst is waiting for input; kill it", correct: false, explanation: "The conffile prompt comes from dpkg itself."}
      - {text: "apt needs --allow-downgrades", correct: false, explanation: "Unrelated to conffiles."}
      - {text: "The conffile was deleted; reinstall the package", correct: false, explanation: "A deleted conffile is a different case."}
