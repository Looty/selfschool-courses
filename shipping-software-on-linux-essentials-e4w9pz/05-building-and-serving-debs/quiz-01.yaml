schemaVersion: 1
id: q09
title: "Check: building .debs with Python"
questions:
  - id: q09-1
    type: sort
    text: "Which approach fits each payload best?"
    concepts: [dpkg-deb, debhelper]
    sources: [43, 44]
    buckets: ["dpkg-deb on a prepared tree", "Source package with dh"]
    items:
      - {text: "A shell script and a config file", bucket: "dpkg-deb on a prepared tree", explanation: "Nothing to compile; lay out the tree and build."}
      - {text: "A prebuilt static binary from CI", bucket: "dpkg-deb on a prepared tree", explanation: "The payload already exists."}
      - {text: "A C program that links to system libraries", bucket: "Source package with dh", explanation: "debhelper handles building, library dependencies and packaging steps."}
      - {text: "A Python library meant for /usr/lib/python3/dist-packages", bucket: "Source package with dh", explanation: "pybuild builds it for the distribution's Python."}
  - id: q09-2
    type: fill
    text: "Complete the minimal debian/rules for a Python package built with pybuild."
    concepts: [debian-rules, pybuild]
    sources: [44, 45]
    template: |
      #!/usr/bin/make -f
      %:
      	dh $@ --with {{1}} --buildsystem={{2}}
    chips:
      - {text: "python3", slot: 1, explanation: "The dh-python add-on; dh does not run Python tools by default."}
      - {text: "pybuild", slot: 2, explanation: "pybuild drives the Python build, including PEP 517 via its pyproject plugin."}
      - {text: "pip", explanation: "pip is not a debhelper build system."}
      - {text: "virtualenv", explanation: "That is dh-virtualenv's add-on name pattern, not pybuild's."}
  - id: q09-3
    type: mcq
    text: "Why does the course's tiny-deb build copy the tree and chmod every file before calling dpkg-deb?"
    concepts: [dpkg-deb, permissions]
    sources: [43]
    options:
      - {text: "Files on a Windows or macOS mount do not carry Unix permissions, and dpkg-deb checks maintainer-script permissions", correct: true, explanation: "The copy gives a tree with the intended modes."}
      - {text: "dpkg-deb deletes its input directory", correct: false, explanation: "It does not."}
      - {text: "To make the files root-owned", correct: false, explanation: "Ownership is handled by --root-owner-group, not chmod."}
      - {text: "To compress the files", correct: false, explanation: "Compression is not why the tree is copied; the copy fixes permissions."}
  - id: q09-4
    type: spot
    text: "This .deb bundles a venv built with Debian 12's /usr/bin/python3. It installs fine, but `devenv` fails with `cannot execute: required file not found` on a minimal host. Which line is the cause?"
    concepts: [bundled-venv, depends]
    sources: [2]
    code: |
      Package: shiplab-devenv
      Version: 0.1.0-1
      Architecture: all
      Depends: python3.11
      Description: devenv CLI with a bundled virtualenv
    correct: [4]
    explanation: "The venv's bin/python3 links to /usr/bin/python3, which comes in through the python3 package (via python3-minimal); python3.11 alone did not provide it in the lab. Depend on python3 (>= 3.11), python3 (<< 3.12)."
  - id: q09-5
    type: mcq
    text: "Why does the bundled-venv package also need an upper bound, `python3 (<< 3.12)`?"
    concepts: [bundled-venv, interpreter-range]
    sources: [2]
    options:
      - {text: "The venv's packages live under lib/python3.11/, so a 3.12 interpreter would not see them", correct: true, explanation: "The bound stops apt from moving the host to an interpreter the venv was not built for without also upgrading the package."}
      - {text: "Python 3.12 cannot run any venv", correct: false, explanation: "It can run venvs built for 3.12."}
      - {text: "dpkg needs both bounds to parse the field", correct: false, explanation: "A single clause is valid."}
      - {text: "To make the package Architecture: any", correct: false, explanation: "Unrelated."}
  - id: q09-6
    type: match
    text: "Match each tool to what it does."
    concepts: [packaging-tools]
    sources: [45, 46, 48]
    pairs:
      - {left: "pybuild", right: "Builds Python modules for the distribution's Python into dist-packages", explanation: "dh-python's build system."}
      - {left: "dh-virtualenv", right: "Adds a dh_virtualenv step that ships a prebuilt virtualenv in the package", explanation: "Self-contained Python deployment."}
      - {left: "nFPM", right: "Packages prepared files into deb, rpm and other formats", explanation: "A single Go binary."}
    distractors:
      - "Resolves PyPI dependencies into Debian packages automatically"
