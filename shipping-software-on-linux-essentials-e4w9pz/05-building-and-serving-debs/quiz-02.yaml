schemaVersion: 1
id: q10
title: "Check: signed repo and hotfix"
questions:
  - id: q10-1
    type: trace
    text: "Trace the versions installed on the client after each lab step."
    concepts: [lab-2, hotfix]
    sources: [31, 33]
    code: |
      apt-get install shiplab-suite                    # repo: devenv 0.1.0-1, suite 1.0-1
      # publish shiplab-devenv 0.1.1-1 only
      apt-get install --only-upgrade shiplab-devenv
    variables: [devenv, suite]
    steps:
      - {label: "after line 1", values: {devenv: ["0.1.0-1"], suite: ["1.0-1"]}}
      - {label: "after line 3", values: {devenv: ["0.1.1-1"], suite: ["1.0-1"]}}
    explanation: "The suite's range (>= 0.1.0-1, << 0.2) allows the hotfix, so only shiplab-devenv changes."
  - id: q10-2
    type: mcq
    text: "Why did the hotfix not require a new version of shiplab-suite?"
    concepts: [meta-package, version-ranges]
    sources: [31, 33]
    options:
      - {text: "Its Depends uses a range, and 0.1.1-1 is inside it", correct: true, explanation: "A pin with = would have forced a suite rebuild for every component fix."}
      - {text: "apt ignores meta-package dependencies", correct: false, explanation: "apt enforces them."}
      - {text: "reprepro updates dependent packages automatically", correct: false, explanation: "It does not rewrite packages."}
      - {text: "Because both packages are Architecture: all", correct: false, explanation: "Architecture has nothing to do with it."}
  - id: q10-3
    type: spot
    text: "This client source should only accept packages signed by the product key. Which line weakens that?"
    concepts: [signed-by, apt-sources]
    sources: [50]
    code: |
      Types: deb
      URIs: https://pkgs.example.invalid/product/
      Suites: stable
      Components: main
      Trusted: yes
      Signed-By: /usr/share/keyrings/product-archive-keyring.gpg
    correct: [5]
    explanation: "Trusted: yes tells apt to treat the source as trusted even if it fails authentication checks, which defeats Signed-By."
  - id: q10-4
    type: mcq
    text: "After publishing a hotfix with reprepro, the previous .deb is gone from the pool and you need to roll back quickly. Which tool feature is designed for this?"
    concepts: [aptly-snapshots, rollback]
    sources: [52]
    options:
      - {text: "aptly snapshots: republish the previous immutable snapshot", correct: true, explanation: "Snapshots are immutable package lists meant for repeatability and controlled changes."}
      - {text: "Signed-By on clients", correct: false, explanation: "Signed-By chooses which key to trust; it does not keep old versions."}
      - {text: "Trusted: yes on clients", correct: false, explanation: "Unrelated to versions, and unsafe."}
      - {text: "A flat repository", correct: false, explanation: "Layout does not keep old versions."}
  - id: q10-5
    type: match
    text: "Match each sources.list feature to its use."
    concepts: [apt-sources, offline-repos]
    sources: [50]
    pairs:
      - {left: "Signed-By", right: "Verify this source against one specific keyring", explanation: "Not every key apt trusts."}
      - {left: "file:", right: "Use a local directory as an archive", explanation: "Offline or mounted media."}
      - {left: "copy:", right: "Like file:, but packages are copied into apt's cache", explanation: "Useful for removable media."}
      - {left: "Suite ending in /", right: "A flat repository with no components", explanation: "An exact path."}
    distractors:
      - "Download packages from PyPI"
  - id: q10-6
    type: sort
    text: "Sort each item by where it lives in the lab."
    concepts: [lab-2, artifacts]
    sources: [43, 51]
    buckets: ["Committed to the course repository", "Built or generated in containers only"]
    items:
      - {text: "build-deb.sh and lab3-run.sh", bucket: "Committed to the course repository", explanation: "Scripts are source."}
      - {text: "shiplab-devenv_0.1.1-1_all.deb", bucket: "Built or generated in containers only", explanation: "Build outputs are never committed."}
      - {text: "The repository's signing key", bucket: "Built or generated in containers only", explanation: "Generated in a volume and deleted at the end."}
      - {text: "dists/stable/InRelease", bucket: "Built or generated in containers only", explanation: "Generated by reprepro."}
      - {text: "The devenv project's pyproject.toml", bucket: "Committed to the course repository", explanation: "Source of the package."}
