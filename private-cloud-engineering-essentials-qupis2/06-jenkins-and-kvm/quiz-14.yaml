schemaVersion: 1
id: q14
title: "Check: Jenkins pipelines and KVM"
questions:
  - id: q14-2
    type: mcq
    text: |
      A Declarative pipeline starts with `agent none` at the top. What must each stage that runs steps then have?

      Hint: `none` means no machine is chosen for the whole run.
    concepts: [jenkins-declarative-structure]
    sources: [143]
    options:
      - {text: "Its own agent directive, such as agent { label 'docker' }", correct: true, explanation: "With agent none nothing is allocated at the top, so each stage declares where it runs."}
      - {text: "Nothing; the stages run on the controller", correct: false, explanation: "Misconception: no agent means the controller. agent none allocates nothing; the stage needs its own agent."}
      - {text: "A node block around its steps", correct: false, explanation: "Misconception: Scripted syntax mixes into Declarative. node is a Scripted block; Declarative uses agent."}
      - {text: "A post block", correct: false, explanation: "Misconception: post chooses where a stage runs. post runs after the stage; it chooses nothing."}
  - id: q14-3
    type: mcq
    text: |
      A stage has `when { branch 'main' }`. The file runs in a plain Pipeline job, not a Multibranch one, building `main`. What happens to the stage?

      Hint: where does `branch` get the branch name from?
    concepts: [jenkins-when, jenkins-multibranch]
    sources: [143, 146]
    options:
      - {text: "It is skipped: the condition never matches outside Multibranch", correct: true, explanation: "branch works only in a Multibranch Pipeline. The course's test run printed: Stage \"Deploy\" skipped due to when conditional."}
      - {text: "It runs, because the code is on main", correct: false, explanation: "Misconception: Jenkins reads the branch from Git in any job. The branch condition needs the Multibranch job type."}
      - {text: "The whole pipeline fails with a syntax error", correct: false, explanation: "Misconception: an unmatched condition is invalid syntax. The file is valid; the stage is quietly skipped."}
      - {text: "It runs on every branch", correct: false, explanation: "Misconception: an unusable condition is ignored. It does not match, so the stage is skipped, not always run."}
  - id: q14-4
    type: mcq
    text: |
      The previous run was FAILURE and this run is SUCCESS. Which comparing `post` block runs?

      Hint: one hook means back to green, the other fell back to red.
    concepts: [jenkins-post-conditions]
    sources: [143]
    options:
      - {text: "fixed", correct: true, explanation: "fixed runs on a success after a failed or unstable run."}
      - {text: "regression", correct: false, explanation: "Misconception: the two names are swapped. regression is failure, unstable or aborted after a success."}
      - {text: "failure", correct: false, explanation: "Misconception: failure looks at the previous run. It looks at this run, which succeeded."}
      - {text: "None; comparing blocks only run on failures", correct: false, explanation: "Misconception: post exists only for errors. changed and fixed both run here."}
  - id: q14-5
    type: mcq
    text: |
      The previous run failed and this run failed again. Does `changed` run?

      Hint: changed compares this status with the previous one.
    concepts: [jenkins-post-conditions]
    sources: [143]
    options:
      - {text: "No: the status is the same as last time", correct: true, explanation: "changed needs a different status from the previous run. always, failure and cleanup run here."}
      - {text: "Yes: something in the code changed", correct: false, explanation: "Misconception: changed means a code change. It means the build status changed."}
      - {text: "Yes: changed runs on every failure", correct: false, explanation: "Misconception: changed is another failure block. A second failure in a row is no change."}
      - {text: "Only if cleanup ran first", correct: false, explanation: "Misconception: cleanup runs first. cleanup runs last, after every other condition."}
  - id: q14-6
    type: mcq
    text: |
      Which layer of the stack models the VM's memory, disks and network cards?

      Hint: one layer is kernel code that only runs the CPU.
    concepts: [kvm-qemu-stack]
    sources: [89, 104]
    options:
      - {text: "QEMU, a user-space process per VM", correct: true, explanation: "QEMU models the machine and asks KVM to run the guest CPU."}
      - {text: "KVM, the kernel modules", correct: false, explanation: "Misconception: KVM is the whole hypervisor. KVM runs the CPU through /dev/kvm; QEMU provides the devices."}
      - {text: "libvirt", correct: false, explanation: "Misconception: the manager is the emulator. libvirt defines, starts and stops VMs; QEMU runs them."}
      - {text: "Intel VT / AMD-V", correct: false, explanation: "Misconception: the CPU extension emulates devices. It only lets guest code run on the real CPU."}
  - id: q14-7
    type: mcq
    text: |
      On a host, `egrep -c '^flags.*(vmx|svm)' /proc/cpuinfo` prints 8, but `ls -l /dev/kvm` says "No such file or directory". Can VMs here use KVM?

      Hint: there are two checks; how many must pass?
    concepts: [kvm-qemu-stack]
    sources: [86, 104]
    options:
      - {text: "No: the CPU has VT, but the KVM device is missing", correct: true, explanation: "Both checks must pass. The course's test container showed exactly this: flags present, no /dev/kvm."}
      - {text: "Yes: the CPU flags are enough", correct: false, explanation: "Misconception: CPU support equals KVM access. User space talks to KVM through /dev/kvm, which is missing."}
      - {text: "Yes, once libvirt is installed", correct: false, explanation: "Misconception: libvirt supplies KVM. libvirt manages VMs; KVM is kernel modules exposed as /dev/kvm."}
      - {text: "The 8 means 8 VMs can run", correct: false, explanation: "Misconception: -c counts VM slots. It counts the matching lines in /proc/cpuinfo."}
  - id: q14-8
    type: mcq
    text: |
      You run `virsh destroy web1` on a persistent domain. What is true afterwards?

      Hint: the name sounds worse than the effect.
    concepts: [virsh-verbs]
    sources: [95]
    options:
      - {text: "It is shut off, still defined, and `virsh start web1` boots it again", correct: true, explanation: "destroy is a power cut; storage and definition are kept."}
      - {text: "Its disk images are deleted", correct: false, explanation: "Misconception: destroy deletes data. Storage is kept."}
      - {text: "Its definition is removed", correct: false, explanation: "Misconception: destroy and undefine are the same. undefine removes the stored config."}
      - {text: "The guest OS was asked to stop and may still be running", correct: false, explanation: "Misconception: destroy is a polite stop. That is shutdown; destroy stops it at once."}
  - id: q14-9
    type: mcq
    text: |
      You start a long-lived VM with `virsh create vm.xml`. After its first stop, `virsh list --all` no longer shows it. Why?

      Hint: create and define make two different kinds of domain.
    concepts: [virsh-verbs, persistent-transient]
    sources: [94, 95]
    options:
      - {text: "create makes a transient domain, which vanishes when it stops; use define, then start", correct: true, explanation: "A transient domain exists only while it runs; a persistent one is defined first and kept."}
      - {text: "Someone ran undefine on it", correct: false, explanation: "Misconception: only undefine removes a domain. A transient domain disappears by itself when it stops."}
      - {text: "list --all hides shut-off domains", correct: false, explanation: "Misconception: --all shows running ones only. --all includes shut-off persistent domains."}
      - {text: "create deleted the XML file", correct: false, explanation: "Misconception: the file is the domain. libvirt keeps its own copy for persistent domains; the file is untouched."}
  - id: q14-1
    type: spot
    diff: true
    text: |
      A colleague tidied the Jenkinsfile of a Multibranch job. After the merge, every feature branch deploys to production. Click the changed line that causes it.

      Hint: which line limited the Deploy stage?
    concepts: [jenkins-when, jenkins-multibranch]
    sources: [143]
    code: |2
       stage('Test') {
           agent { label 'docker' }
      -    steps { sh 'make check' }
      +    steps { sh 'make check-all' }
       }
       stage('Deploy') {
      -    when { branch 'main' }
           agent { label 'deploy' }
      -    steps { sh './deploy.sh' }
      +    steps { sh './deploy.sh --wait' }
       }
    correct: [7]
    explanation: "The removed when { branch 'main' } was the only thing limiting the stage to main. Without a when directive a stage runs on every branch the Multibranch job builds. The other changed lines only alter which commands run."
