schemaVersion: 1
id: q05
title: "Check: permissions and disks"
questions:
  - id: q05-1
    type: mcq
    text: |
      Which letters does the octal digit 5 stand for?

      Hint: break 5 into 4, 2 and 1.
    concepts: [permission-bits]
    sources: [122]
    options:
      - {text: "r-x", correct: true, explanation: "5 = 4 + 1: read and execute, no write."}
      - {text: "rw-", correct: false, explanation: "Misconception: the 1 is write. Write is 2 and execute is 1, so rw- is 6."}
      - {text: "-wx", correct: false, explanation: "Misconception: the digits count up from write. -wx is 2 + 1 = 3."}
      - {text: "r--", correct: false, explanation: "Misconception: odd digits drop a bit. r-- is 4; 5 adds the execute bit."}
  - id: q05-2
    type: mcq
    text: |
      `app.conf` is mode 640, owner alice, group ops. User carol is not alice and not in ops. What can carol do with the file?

      Hint: read the third digit.
    concepts: [permission-bits]
    sources: [122]
    options:
      - {text: "Nothing: the other digit is 0", correct: true, explanation: "640 is rw- for the owner, r-- for the group and --- for everyone else."}
      - {text: "Read it, because 4 is read", correct: false, explanation: "Misconception: the 4 belongs to everyone. The middle digit 4 is the group's; carol is not in the group."}
      - {text: "Read and write it, because 6 is rw-", correct: false, explanation: "Misconception: the first digit is for all users. The first digit is only the owner's."}
      - {text: "Read it, because config files are always world-readable", correct: false, explanation: "Misconception: file type sets the rights. Only the mode does; 644 would be world-readable, 640 is not."}
  - id: q05-3
    type: mcq
    text: |
      A file is mode 0604, owner alice, group ops. bob is in ops but is not alice. Can bob read it?

      Hint: the kernel uses exactly one digit per user.
    concepts: [permission-bits]
    sources: [122]
    options:
      - {text: "No: as a group member he gets only the group digit, 0", correct: true, explanation: "Owner digit if you own it, else group digit if you are in its group, else other. bob gets 0 even though others get 4."}
      - {text: "Yes: the other digit 4 lets everyone read", correct: false, explanation: "Misconception: a user gets every digit that matches. Once the group digit applies, the other digit is never checked."}
      - {text: "Yes: the digits are added, 0 + 4 = 4", correct: false, explanation: "Misconception: permissions from several classes combine. Only one class applies."}
      - {text: "No, because only the owner can ever read a file", correct: false, explanation: "Misconception: reading is owner-only. With 0640 the group could read; here the group digit is simply 0."}
  - id: q05-4
    type: mcq
    text: |
      bob may write in /srv/team (mode 770, group ops, bob is in ops). Inside is `notes.txt`, mode 0400, owned by alice. Can bob delete it?

      Hint: deleting changes which list?
    concepts: [directory-permissions]
    sources: [122]
    options:
      - {text: "Yes: removing a name needs write on the directory, not on the file", correct: true, explanation: "A delete edits the directory's list of names. The test run showed bob deleting alice's 0400 file in a 770 directory."}
      - {text: "No: the file is read-only (0400)", correct: false, explanation: "Misconception: deleting needs write on the file. The file's mode decides its content, not whether its name can be removed."}
      - {text: "No: only the owner can delete a file", correct: false, explanation: "Misconception: ownership controls deletion in every directory. That is only true in a sticky directory such as /tmp."}
      - {text: "Only with execute permission on the file", correct: false, explanation: "Misconception: x on the file matters for deletion. x on the file only matters for running it."}
  - id: q05-5
    type: mcq
    text: |
      A directory is mode 710, owner alice, group ops. bob is in ops. Inside is `report.txt`, mode 0640, group ops. What can bob do?

      Hint: the group digit of the directory is 1. What does x alone allow on a directory?
    concepts: [directory-permissions]
    sources: [122]
    options:
      - {text: "cat dir/report.txt works, but ls dir is denied", correct: true, explanation: "x lets him pass through to a name he already knows; without r he cannot list the names. That matches the test run."}
      - {text: "ls dir works, but cat dir/report.txt is denied", correct: false, explanation: "Misconception: x on a directory means list. That is r; the 740 row shows r without x: ls works, cat is denied."}
      - {text: "Nothing at all: 1 is too little to use a directory", correct: false, explanation: "Misconception: a directory needs r to be used. x is search, enough to reach a known file."}
      - {text: "He can also create files, since he can enter the directory", correct: false, explanation: "Misconception: entering means writing. Creating a name needs w on the directory."}
  - id: q05-6
    type: mcq
    text: |
      A 2 GB log was deleted with rm, but `df -h` shows the same usage and `du` no longer counts the file. What is the most likely cause?

      Hint: when is a file's data actually freed?
    concepts: [deleted-open-files, df-du]
    sources: [115, 122]
    options:
      - {text: "A running process still holds the file open, so its data is not freed yet", correct: true, explanation: "rm removes the name; data is freed when the last name is gone and no process holds it open. lsof +L1 lists such files."}
      - {text: "df caches its numbers for a few minutes", correct: false, explanation: "Misconception: df lags behind. It reads the filesystem's current numbers; the blocks really are still used."}
      - {text: "du is wrong, because it cannot read the log's directory", correct: false, explanation: "Misconception: du missed the file by accident. du sums files by name, and the name is gone."}
      - {text: "The filesystem ran out of inodes", correct: false, explanation: "Misconception: inode exhaustion keeps data around. Running out of inodes stops new files; it does not hold deleted data."}
  - id: q05-7
    type: mcq
    text: |
      `touch` fails with "No space left on device", but `df -h` shows the filesystem 2% used. What do you run next?

      Hint: blocks are not the only thing a filesystem can run out of.
    concepts: [inodes, df-du]
    sources: [114]
    options:
      - {text: "df -i", correct: true, explanation: "It shows inodes; one per file. Many small files can use 100% of them while blocks are free."}
      - {text: "lsof +L1", correct: false, explanation: "Misconception: every df puzzle is a deleted-open file. That explains df higher than du, not 2% used with no room."}
      - {text: "du -sh /", correct: false, explanation: "Misconception: du finds any kind of full. du -sh sums blocks, and blocks are fine here; du -s --inodes would help after df -i."}
      - {text: "chmod 777 on the directory", correct: false, explanation: "Misconception: 'no space' is a permission problem. Permission errors say Permission denied."}
  - id: q05-8
    type: mcq
    text: |
      `/srv/exports` is mode 750, owner root, group export. The export job runs as user export (in group export) and cannot create its output file there. Which fix is right?

      Hint: give the group exactly what it lacks.
    concepts: [directory-permissions, permission-bits]
    sources: [122]
    options:
      - {text: "chmod 770 /srv/exports", correct: true, explanation: "The group digit goes from 5 (r-x) to 7 (rwx), adding the missing write; others still get nothing."}
      - {text: "chmod 777 /srv/exports", correct: false, explanation: "Misconception: if it works it is fine. 777 lets every user on the box replace or delete the exports."}
      - {text: "chmod 750 on the output file", correct: false, explanation: "Misconception: the new file's mode matters. Creating a name needs w on the directory, and the file does not exist yet."}
      - {text: "Test it as root first; if root can write, the mode is fine", correct: false, explanation: "Misconception: root shows what users can do. Root skips read and write checks; test as the service's user."}
