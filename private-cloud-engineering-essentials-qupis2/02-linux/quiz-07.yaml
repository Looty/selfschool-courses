schemaVersion: 1
id: q07
title: "Check: the broken box and Bash strict mode"
questions:
  - id: q07-1
    type: trace
    text: "The lines run in order in one bash session. What does `echo $?` print after each?"
    concepts: [pipeline-exit-status, pipefail]
    sources: [124]
    code: |
      false | true; echo $?
      set -o pipefail
      false | true; echo $?
      (exit 3) | (exit 5) | true; echo $?
      true | (exit 4) | (exit 0); echo $?
      grep -c x /nonexistent | sort; echo $?
    variables: [status]
    steps:
      - {label: "Line 1", values: {status: "0"}}
      - {label: "Line 3", values: {status: "1"}}
      - {label: "Line 4", values: {status: "5"}}
      - {label: "Line 5", values: {status: "4"}}
      - {label: "Line 6", values: {status: "2"}}
    explanation: "Without pipefail a pipeline returns its last command's status, so line 1 gives 0. With pipefail it returns the status of the rightmost command that failed: 1 from false, 5 (not 3) because exit 5 is further right, 4 even though the last command succeeded, and 2 from grep, which could not open the file, while sort succeeded."
  - id: q07-2
    type: sort
    text: "Each line runs in a script that starts with `set -e` (pipefail only where written). Does the script stop at it?"
    concepts: [set-e, strict-mode]
    sources: [124]
    buckets: ["Script stops", "Script continues"]
    items:
      - {text: "cd /nonexistent", bucket: "Script stops", explanation: "A simple command that fails, outside any exception, ends the script."}
      - {text: "set -o pipefail; false | true", bucket: "Script stops", explanation: "With pipefail the pipeline's status is 1, so -e fires."}
      - {text: "if grep -q x /nonexistent; then :; fi", bucket: "Script continues", explanation: "A command tested by if is exempt from -e."}
      - {text: "false || echo fallback", bucket: "Script continues", explanation: "Only the last command of an && or || list can trigger -e."}
      - {text: "false && echo yes", bucket: "Script continues", explanation: "false is not the last command of the list, so -e ignores it."}
      - {text: "false | true   (no pipefail)", bucket: "Script continues", explanation: "The pipeline returns true's status, 0."}
      - {text: "f() { false; echo after; }; if f; then :; fi", bucket: "Script continues", explanation: "f runs as an if condition, so -e is ignored for every command inside it and 'after' is printed."}
  - id: q07-3
    type: fill
    text: "Complete the nightly pipeline that counts running VMs per hypervisor from lines like `hv01,vm-101,running`."
    concepts: [pipelines, text-processing]
    sources: [124]
    template: |
      cat *.csv | grep {{1}} | cut -d, -f{{2}} | {{3}} | uniq -c
    chips:
      - {text: "',running$'", slot: 1, explanation: "Keeps only lines whose last field is running; the $ anchors it to the end of the line."}
      - {text: "1", slot: 2, explanation: "The hypervisor is the first comma-separated field."}
      - {text: "sort", slot: 3, explanation: "uniq -c counts only adjacent equal lines, so the input must be sorted first."}
      - {text: "2", explanation: "Field 2 is the VM name, which would count each VM once."}
      - {text: "uniq", explanation: "uniq before sort would miss repeated hypervisors that are not on adjacent lines."}
  - id: q07-4
    type: mcq
    text: "A cron job uses `./backup.sh 2>&1 > /var/log/backup.log`. Errors still show up in the cron mail and not in the log. Why?"
    concepts: [redirections]
    sources: [124]
    options:
      - {text: "Redirections apply left to right: stderr was copied to the old stdout before stdout moved to the file", correct: true, explanation: "Write > /var/log/backup.log 2>&1 so stderr copies stdout after it points at the file."}
      - {text: "2>&1 only works inside a pipeline", correct: false, explanation: "It works with any command; the order is the problem."}
      - {text: "cron ignores redirections", correct: false, explanation: "The shell that cron starts processes them normally; stdout did go to the file."}
      - {text: "Bash needs &> instead, and 2>&1 is obsolete", correct: false, explanation: "&> is a shorter form of > file 2>&1, but 2>&1 is valid; here it is just in the wrong position."}
  - id: q07-5
    type: match
    text: "Match each broken-box finding to the fix that removes its cause."
    concepts: [linux-troubleshooting]
    sources: [105, 114, 122, 125]
    pairs:
      - {left: "boot.log: failed with exit status 126", right: "chmod 0755 on the program, then start it", explanation: "126 is 'found but not executable'; 755 adds execute without letting others write."}
      - {left: "ss shows 127.0.0.1:8080", right: "bind = 0.0.0.0 in the config, then restart", explanation: "The service must listen on the address clients use."}
      - {left: "SigIgn has bit 14 set (SIGTERM) in a script process", right: "Replace trap '' TERM with a handler that exits", explanation: "Ignored signals are inherited; killing with -9 fixes only the current copy."}
      - {left: "Five <defunct> children of one parent", right: "Make the parent collect its children, then end the old parent", explanation: "A zombie has already exited; only collecting its status removes it."}
      - {left: "df -i shows IUse% 100 while df -h shows 2%", right: "Delete the stale session files", explanation: "Each file uses an inode; the space was never the problem."}
    distractors:
      - "chmod 777 on the directory"
