schemaVersion: 1
id: q12
title: "Check: a Flask API with an RQ job queue"
questions:
  - id: q12-1
    type: mcq
    text: |
      Which method is idempotent but not safe?

      Hint: safe means it changes nothing; idempotent means a repeat changes nothing more.
    concepts: [safe-methods, idempotent-methods]
    sources: [52]
    options:
      - {text: "DELETE", correct: true, explanation: "DELETE changes state, so it is not safe, but deleting twice leaves the same result as deleting once."}
      - {text: "GET", correct: false, explanation: "Misconception: idempotent and safe exclude each other. GET is both: it only reads, and every safe method is idempotent."}
      - {text: "POST", correct: false, explanation: "Misconception: the same body twice gives the same result. Each POST may create a new VM, so it is neither safe nor idempotent."}
      - {text: "HEAD", correct: false, explanation: "Misconception: HEAD writes something because it has no body. HEAD is GET without the body; it is safe and idempotent."}
  - id: q12-2
    type: mcq
    text: |
      A client sends `POST /vms` and the connection drops before the reply. What is the right retry behaviour?

      Hint: what happens on the server if the first POST did arrive?
    concepts: [idempotent-methods, idempotency-key]
    sources: [52, 58]
    options:
      - {text: "Resend it only with the same Idempotency-Key, so the server can spot the retry", correct: true, explanation: "POST is not idempotent; the draft Idempotency-Key header lets the server recognise a repeat of the same request."}
      - {text: "Resend it as is; HTTP clients retry every method", correct: false, explanation: "Misconception: all methods may be retried automatically. Only idempotent ones may; a blind second POST can build two VMs."}
      - {text: "Assume nothing happened and send a new POST with a new name", correct: false, explanation: "Misconception: a lost reply means a lost request. The first POST may have succeeded, leaving an extra VM."}
      - {text: "Send it again as PUT, because PUT is idempotent", correct: false, explanation: "Misconception: the method name alone makes a request idempotent. The route creates with POST; changing the method changes what the server does, not whether the first request ran."}
  - id: q12-3
    type: mcq
    text: |
      `POST /vms` stores the request, enqueues the build on RQ and replies at once. Which status code fits?

      Hint: does the VM exist at the moment of the reply?
    concepts: [http-status-codes]
    sources: [52]
    options:
      - {text: "202 Accepted", correct: true, explanation: "The request was accepted but processing has not finished; the client polls the Location URL."}
      - {text: "201 Created", correct: false, explanation: "Misconception: storing the request means the VM is created. 201 says the resource exists now; the worker has not built it yet."}
      - {text: "200 OK", correct: false, explanation: "Misconception: any success is 200. 200 says the request succeeded with its result in the body; here the result is still to come."}
      - {text: "204 No Content", correct: false, explanation: "Misconception: a quick reply has no body. 204 means finished with no body; the work is not finished and the reply carries an id."}
  - id: q12-7
    type: mcq
    text: |
      `POST /vms` carries valid JSON, but a VM with that name already exists. Which code?

      Hint: is the request badly formed, or does it clash with what already exists?
    concepts: [http-status-codes]
    sources: [52]
    options:
      - {text: "409 Conflict", correct: true, explanation: "The request clashes with the current state of the resource: the name is taken."}
      - {text: "400 Bad Request", correct: false, explanation: "Misconception: every client error is 400. 400 is for a malformed request such as a body that is not JSON; this one is well formed."}
      - {text: "404 Not Found", correct: false, explanation: "Misconception: an error about a VM means 404. 404 says the resource does not exist; here it exists already."}
      - {text: "500 Internal Server Error", correct: false, explanation: "Misconception: a refused request is a server error. 5xx means the server failed; this is the client asking for something impossible."}
  - id: q12-6
    type: mcq
    text: |
      A job is enqueued with `retry=Retry(max=2, interval=[2, 4])` on a worker started with `--with-scheduler`. The build always fails. How many times does the job run?

      Hint: max counts retries, not runs.
    concepts: [rq-retry]
    sources: [50]
    options:
      - {text: "3", correct: true, explanation: "The first run plus 2 retries, after waits of 2 s and 4 s; then the job is failed."}
      - {text: "2", correct: false, explanation: "Misconception: max is the total number of runs. It is the number of retries after the first run."}
      - {text: "4", correct: false, explanation: "Misconception: each interval value adds a run on top of max. The interval list only sets the waits between the retries."}
      - {text: "It retries until it succeeds", correct: false, explanation: "Misconception: Retry means retry forever. After max retries the job goes to failed."}
  - id: q12-5
    type: mcq
    text: |
      A provisioning job enqueued with default options takes about four minutes. What happens?

      Hint: RQ has a default for how long a job may run.
    concepts: [rq-timeouts]
    sources: [50]
    options:
      - {text: "After 180 seconds the job is killed and marked failed", correct: true, explanation: "The default job_timeout is 180 seconds; pass job_timeout to allow longer."}
      - {text: "It runs to completion; RQ has no timeout unless you set one", correct: false, explanation: "Misconception: no setting means no limit. The default job_timeout is 180 seconds."}
      - {text: "It is discarded after 500 seconds", correct: false, explanation: "Misconception: result_ttl limits run time. 500 s is how long a successful result is kept."}
      - {text: "The worker starts a second copy after 180 seconds", correct: false, explanation: "Misconception: a timeout triggers a parallel run. It fails the job; a rerun happens only through retry."}
  - id: q12-8
    type: mcq
    text: |
      A worker is killed with `kill -9` halfway through a build. The VM record still says `building`. Later the idempotent job runs again. What does it do?

      Hint: the job reads the status first. What does `building` tell it about the earlier run?
    concepts: [idempotent-jobs]
    sources: [50]
    options:
      - {text: "It builds again, because an earlier run died halfway", correct: true, explanation: "The job resumes `requested` and `building`, and does nothing only for active, error, deleted or a missing record."}
      - {text: "It does nothing, because someone is already building", correct: false, explanation: "Misconception: `building` proves a live worker. kill -9 leaves the status behind with no one working on it."}
      - {text: "It sets the VM to error, because RQ marked the job failed", correct: false, explanation: "Misconception: kill -9 lets RQ record a failure. The killed process gets no chance to mark anything."}
      - {text: "It creates a second VM next to the half-built one", correct: false, explanation: "Misconception: a rerun repeats every side effect. The job is written as make this VM built, so it finishes the same VM."}
  - id: q12-9
    type: mcq
    text: |
      Worker A held `lock:vm:42`, but its 10-second expiry passed and worker B now holds the key. A finishes and releases. Why must A delete the key only if it still holds A's token?

      Hint: whose lock is the key at that moment?
    concepts: [redis-lock]
    sources: [51]
    options:
      - {text: "A plain DEL would remove B's lock and let a third worker in", correct: true, explanation: "Compare-and-delete removes the key only if it still holds A's token, so B's lock survives."}
      - {text: "Redis refuses DEL on a key that has an expiry", correct: false, explanation: "Misconception: an expiry makes a key read-only. DEL removes any key; that is the danger."}
      - {text: "It does not matter; B is already finished by then", correct: false, explanation: "Misconception: locks expire only after work ends. The expiry is a timer; B may be mid-build."}
      - {text: "The token makes SET NX succeed for A again", correct: false, explanation: "Misconception: the token is part of acquiring. NX fails while any value is present; the token matters only when releasing."}
  - id: q12-4
    type: trace
    text: |
      A job is enqueued with `retry=Retry(max=2, interval=[2, 4])` on a worker started with `--with-scheduler`. Its build always raises, and each failed attempt adds 1 to the VM's `attempts` field; the third failure also sets the VM to `error`. Fill in the RQ job status, the VM status and `attempts` at each point.

      Hint: between attempts the job waits for its retry time.
    concepts: [rq-retry, rq-job-status]
    sources: [50]
    code: |
      q.enqueue(provision, vm_id, retry=Retry(max=2, interval=[2, 4]))
      # provision(): status -> building, build raises, attempts += 1,
      #              on the 3rd failure status -> error, then re-raise
    variables: [job, vm, attempts]
    steps:
      - {label: "Just enqueued", values: {job: "queued", vm: "requested", attempts: 0}, given: [job, vm, attempts]}
      - {label: "First attempt running", values: {job: "started", vm: "building", attempts: 0}}
      - {label: "After the 1st failure", values: {job: "scheduled", vm: "building", attempts: 1}}
      - {label: "Second attempt running", values: {job: "started", vm: "building", attempts: 1}}
      - {label: "After the 2nd failure", values: {job: "scheduled", vm: "building", attempts: 2}}
      - {label: "Third attempt running", values: {job: "started", vm: "building", attempts: 2}}
      - {label: "After the 3rd failure", values: {job: "failed", vm: "error", attempts: 3}}
    explanation: "Retry(max=2) allows two retries, so three attempts. Between attempts the job waits as scheduled for 2 s and then 4 s. After the last failure it goes to FailedJobRegistry with status failed. The course's test run showed exactly this sequence."
