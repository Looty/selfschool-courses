schemaVersion: 1
id: q11
title: "Check: networking, limits and Compose"
questions:
  - id: q11-2
    type: mcq
    text: |
      A Compose file has `ports: ["18080:8080"]` for api. Which number is the port on the host?

      Hint: host on the left.
    concepts: [port-publishing]
    sources: [77]
    options:
      - {text: "18080", correct: true, explanation: "The mapping is host:container, so host port 18080 forwards to container port 8080."}
      - {text: "8080", correct: false, explanation: "Misconception: the container port comes first. It is the other way round: host first, container second."}
      - {text: "Both: the two numbers are the same port seen twice", correct: false, explanation: "Misconception: -p only names one port. It joins two different ports, one on the host and one in the container."}
  - id: q11-3
    type: mcq
    text: |
      An app listens on `127.0.0.1:8080` inside its container, which runs with `-p 9000:8080`. What does `curl localhost:9000` on the host get?

      Hint: whose loopback is 127.0.0.1 inside a container?
    concepts: [listen-address, port-publishing]
    sources: [77]
    options:
      - {text: "No HTTP answer: nothing listens on the container's network interface", correct: true, explanation: "Forwarded traffic arrives on the container's interface. In the test run curl printed 000 for exactly this case."}
      - {text: "A normal 200 response", correct: false, explanation: "Misconception: 127.0.0.1 inside a container is the host. It is the container's own loopback; the app must listen on 0.0.0.0."}
      - {text: "A 200 response, because -p forwards to the loopback", correct: false, explanation: "Misconception: published ports reach any listener. They reach the container's interface, not its loopback."}
  - id: q11-4
    type: mcq
    text: |
      A container runs `python -m http.server 8000` with `-p 18080:8000`. On the host you run `curl localhost:8000`. What happens?

      Hint: which port did -p open on the host?
    concepts: [port-publishing]
    sources: [77]
    options:
      - {text: "No HTTP answer: only 18080 is published on the host", correct: true, explanation: "The container port is reachable from the host only through the published host port. The test run printed 000."}
      - {text: "200, because the container listens on 8000", correct: false, explanation: "Misconception: a container port is open on the host by itself. Only -p publishes it, and here on 18080."}
      - {text: "200 on both 8000 and 18080", correct: false, explanation: "Misconception: -p opens both numbers on the host. It opens only the left one."}
  - id: q11-5
    type: mcq
    text: |
      Two containers run on Docker's default `bridge` network. Can one reach the other by container name?

      Hint: the probe on the default bridge printed something about the name.
    concepts: [container-networking]
    sources: [75, 76]
    options:
      - {text: "No: on the default bridge they reach each other only by IP", correct: true, explanation: "Name resolution needs a user-defined network, such as the one Compose creates; the probe printed name not found."}
      - {text: "Yes: Docker always resolves container names", correct: false, explanation: "Misconception: every Docker network has name resolution. Only user-defined networks do."}
      - {text: "Only if both use the same image", correct: false, explanation: "Misconception: the image decides networking. The network the containers join decides it."}
  - id: q11-6
    type: mcq
    text: |
      In a Compose project, api has `ports: ["18080:8080"]`. Which address should the worker service use to reach api?

      Hint: inside the network nobody goes through the host.
    concepts: [container-networking, port-publishing]
    sources: [82]
    options:
      - {text: "api:8080", correct: true, explanation: "Compose services resolve each other by service name, and inside the network they use the container port."}
      - {text: "localhost:8080", correct: false, explanation: "Misconception: localhost reaches other containers. In the worker it is the worker itself."}
      - {text: "api:18080", correct: false, explanation: "Misconception: the published port works everywhere. 18080 exists only on the host; the probe got refused on it."}
      - {text: "127.0.0.11:8080", correct: false, explanation: "Misconception: the DNS server is the service. 127.0.0.11 only answers name lookups."}
  - id: q11-7
    type: mcq
    text: |
      Inside a container on a user-defined network, `/etc/resolv.conf` says `nameserver 127.0.0.11`. What is that?

      Hint: what turns `web1` into an address?
    concepts: [container-networking]
    sources: [75]
    options:
      - {text: "Docker's embedded DNS server, which answers container and service names", correct: true, explanation: "Containers on custom networks use Docker's DNS at 127.0.0.11."}
      - {text: "The host's loopback address", correct: false, explanation: "Misconception: 127.x inside a container means the host. It is local to the container's network namespace, where Docker answers DNS."}
      - {text: "The address of the first container on the network", correct: false, explanation: "Misconception: it is a peer container. Containers get addresses like 172.x; 127.0.0.11 is the resolver."}
  - id: q11-8
    type: mcq
    text: |
      api has `depends_on: [db]`. db needs 4 seconds after starting before it accepts connections. When does Compose start api?

      Hint: started and ready are different moments.
    concepts: [compose-depends-on, readiness]
    sources: [81, 82]
    options:
      - {text: "As soon as db's container is running, before db is ready", correct: true, explanation: "Short depends_on only orders start-up; in the lab api checked db too early and served 503."}
      - {text: "After db accepts connections", correct: false, explanation: "Misconception: depends_on waits for ready. That needs a healthcheck and condition: service_healthy."}
      - {text: "After a fixed 10-second wait", correct: false, explanation: "Misconception: Compose adds a delay. It waits for running only, with no timer."}
  - id: q11-9
    type: mcq
    text: |
      Which change makes Compose hold back api until db is ready?

      Hint: Compose needs a way to ask db whether it is ready.
    concepts: [compose-depends-on, readiness]
    sources: [81, 82]
    options:
      - {text: "A healthcheck on db, and depends_on db with condition: service_healthy on api", correct: true, explanation: "In the test run Compose printed db Waiting, then Healthy, then started api, which answered 200."}
      - {text: "restart: on-failure on api", correct: false, explanation: "Misconception: a restart policy handles readiness. It restarts a container that exits; the lab's api stayed up and kept serving 503."}
      - {text: "Listing db above api in the file", correct: false, explanation: "Misconception: file order means start order. The tool for order is depends_on, and on its own it does not wait for ready either."}
  - id: q11-1
    type: spot
    text: |
      db needs about four seconds after it starts before it accepts connections, and api checks the db once at start-up. Click the line that lets api start too early.

      Hint: which line says what api waits for?
    concepts: [compose-depends-on, readiness]
    sources: [81, 82]
    code: |
      services:
        db:
          build: ./db
          environment:
            LOAD_SECONDS: "4"
        api:
          build: ./app
          ports:
            - "127.0.0.1:18080:8080"
          depends_on: [db]
    correct: [10]
    explanation: "The short depends_on syntax only waits until the db container is running, not until it is ready. Add a healthcheck to db and use depends_on with condition: service_healthy (and retry in the api code as well)."
