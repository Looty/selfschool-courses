id: private-cloud-engineering-essentials-qupis2
title: "Private Cloud Engineering: Essentials"
short_intro: "The short path: Python you can type from memory, Linux and Git under pressure, containers, a Flask job-queue API, and a VM provisioning design."
description: |
  A short cut of "Private Cloud Engineering with Python" for engineers who need the working core fast: about
  seven hours with every quiz, exercise and lab, under two hours of reading.
  Lessons are short and every one ends in something you do: a timed Python problem, a terminal lab or a
  design sketch.

  It starts with the dozen standard-library tools you really type in a bare browser editor and two timed
  infrastructure problems. Linux gets the most room: processes, signals and systemd, files and permissions,
  network and SSH troubleshooting, and a broken-box lab. Then Git with a recovery lab, containers with a
  debugging lab, a Flask API with an RQ job queue, the design of a self-service VM provisioning service, and
  a short closing lesson on Jenkins pipelines and KVM with libvirt.

  Who it is for: DevOps and platform engineers with a few years of experience. Labs run with Python 3 and
  Docker. Every factual claim cites a source from sources.md. For depth on any topic, see the full course.
